<script>
(() => {
  function initializeTOC() {
    const nav = document.querySelector("nav.toc");
    const masthead = document.querySelector(".masthead");

    if (!nav || !masthead) return;

    const entries = Array.from(nav.querySelectorAll("a[href*='#']"))
      .map(link => {
        try {
          const url = new URL(link.href, location.href);
          if (!url.hash || url.pathname !== location.pathname) return null;

          const heading = document.getElementById(
            decodeURIComponent(url.hash.slice(1))
          );

          return heading ? {
            link,
            item: link.closest("li"),
            heading
          } : null;
        } catch {
          return null;
        }
      })
      .filter(Boolean);

    if (!entries.length) return;

    const getOffset = () =>
        masthead.getBoundingClientRect().height + 1;

    entries.forEach(({ heading }) => {
      heading.style.scrollMarginTop = `${getOffset()}px`;
    });

    let lastScrollY = window.scrollY;
    let scheduled = false;

    function setActive(active) {
      entries.forEach(entry => {
        entry.item?.classList.toggle("active", entry === active);
        entry.heading.classList.toggle("active", entry === active);
      });
    }

    function updateActive() {
      const currentScrollY = window.scrollY;
      const scrollingUp = currentScrollY < lastScrollY;
      lastScrollY = currentScrollY;

      const offset = getOffset();
      const atBottom =
        currentScrollY + window.innerHeight >=
        document.documentElement.scrollHeight - 2;

      let active = entries[0];

      if (atBottom) {
        active = entries[entries.length - 1];
      } else if (scrollingUp) {
        // Position-based detection when scrolling upward.
        for (const entry of entries) {
          if (entry.heading.getBoundingClientRect().top <= offset) {
            active = entry;
          } else {
            break;
          }
        }
      } else {
        // Same heading threshold used by Gumshoe when scrolling downward.
        for (const entry of entries) {
          if (entry.heading.getBoundingClientRect().top <= offset) {
            active = entry;
          } else {
            break;
          }
        }
      }

      setActive(active);
    }

    function scheduleUpdate() {
      if (scheduled) return;
      scheduled = true;

      requestAnimationFrame(() => {
        scheduled = false;
        updateActive();
      });
    }

    window.addEventListener("scroll", scheduleUpdate, { passive: true });
    window.addEventListener("resize", scheduleUpdate);
    window.addEventListener("hashchange", scheduleUpdate);

    nav.addEventListener("click", () => {
      scheduleUpdate();
      requestAnimationFrame(scheduleUpdate);
    });

    updateActive();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initializeTOC);
  } else {
    initializeTOC();
  }
})();
</script>
