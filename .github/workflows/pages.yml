
name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout JellyBridge
        uses: actions/checkout@v7

      - name: Move Markdown files into readme directory
        run: |
          mkdir -p readme
          find . -maxdepth 1 -type f -name '*.md' -exec mv {} readme/ \;
          mv LICENSE readme/LICENSE.txt

      - name: Update links in Markdown files
        run: |
          sed -i \
            -e 's|(Development\.md)|(/JellyBridge/development/)|g' \
            -e 's|(Version\.md)|(/JellyBridge/releases/)|g' \
            -e 's|(LICENSE)|(/JellyBridge/license/)|g' \
            readme/*.md

      - name: Move docs files into base directory
        run: |
          mv docs/* .
          rmdir docs

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: .
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
